[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.12.0"

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "https://tribera.ai/*"
  to = "https://www.tribera.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://tribera.ai/*"
  to = "https://www.tribera.ai/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://*.crisp.chat https://code.iconify.design https://unpkg.com https://www.googletagmanager.com https://res.public.onecdn.static.microsoft https://statics.teams.cdn.office.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://*.crisp.chat https://client.crisp.chat https://fonts.googleapis.com; connect-src 'self' blob: data: https://*.crisp.chat https://client.crisp.chat https://api.web3forms.com wss://*.crisp.chat wss://ws.crisp.chat wss://*.relay.crisp.chat https://www.google-analytics.com https://region1.google-analytics.com https://customerconnect.teams.usercontent.microsoft https://statics.teams.cdn.office.net https://*.environment.api.powerplatform.com https://directline.botframework.com wss://directline.botframework.com https://*.directline.botframework.com wss://*.directline.botframework.com https://browser.events.data.microsoft.com; frame-ancestors 'self'; frame-src https://*.crisp.chat https://customerconnect.teams.usercontent.microsoft; font-src 'self' data: https://*.crisp.chat https://fonts.gstatic.com; media-src 'self' https://*.crisp.chat;"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
