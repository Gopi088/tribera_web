site:
  name: tribera
  site: 'https://www.tribera.ai'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: 'tribera — Belong.Build.Become.'
    template: '%s — tribera'
  description: 'tribera helps hiring teams make faster, sharper decisions with AI signal analysis, advisor-led interviews, and role-fit shortlists.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: tribera
    images:
      - url: 'https://www.tribera.ai/og-default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: null
    site: null
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: false

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: G-53PX4YFSBF
      partytown: false

ui:
  theme: 'light' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
