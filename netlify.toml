[build]
  publish = "dist"
  command = "npm run build"
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://client.crisp.chat https://static.crisp.chat https://code.iconify.design https://unpkg.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://client.crisp.chat https://ws.crisp.chat https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self'; frame-src https://client.crisp.chat;"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
