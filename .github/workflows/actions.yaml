name: GitHub Actions

on:
  pull_request:
    branches: [main, feat/v9-migration]
  push:
    branches: [main, 'feat/v9-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:migration:unit

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-migration-build.mjs
      - run: npm run test:migration:static
      - run: node tests/built-links.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          if-no-files-found: error
      - run: npm run build
        env:
          V9_PREVIEW: '1'
      - run: node scripts/check-migration-build.mjs --preview
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-build
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-gate-evidence
          path: artifacts/v9-gates/

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
        artifact: [production-build, foundation-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:migration:browser
        env:
          V9_BROWSER: ${{ matrix.browser }}
          V9_REQUIRE_FOUNDATION: ${{ matrix.artifact == 'foundation-build' && '1' || '0' }}
      - run: npm run test:migration:foundation
        if: matrix.artifact == 'foundation-build'
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.artifact }}
          path: artifacts/

  legacy-regression:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-reviewed-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-regression-evidence
          path: artifacts/

  migration-required:
    if: always()
    needs: [check, unit, build, browser, legacy-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Require every migration job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); const failed = Object.entries(results).filter(([, job]) => job.result !== "success"); if (failed.length) { console.error(failed); process.exit(1); }'
