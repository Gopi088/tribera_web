worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;
        include /etc/nginx/mime.types;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://*.crisp.chat https://code.iconify.design https://unpkg.com https://www.googletagmanager.com https://res.public.onecdn.static.microsoft https://statics.teams.cdn.office.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://*.crisp.chat https://client.crisp.chat; connect-src 'self' blob: data: https://*.crisp.chat https://client.crisp.chat https://api.web3forms.com wss://*.crisp.chat wss://ws.crisp.chat wss://*.relay.crisp.chat https://www.google-analytics.com https://region1.google-analytics.com https://customerconnect.teams.usercontent.microsoft https://statics.teams.cdn.office.net https://*.environment.api.powerplatform.com https://directline.botframework.com wss://directline.botframework.com https://*.directline.botframework.com wss://*.directline.botframework.com https://browser.events.data.microsoft.com; frame-ancestors 'self'; frame-src https://*.crisp.chat https://customerconnect.teams.usercontent.microsoft; font-src 'self' data: https://*.crisp.chat; media-src 'self' https://*.crisp.chat;" always;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        location / {
            try_files $uri $uri/index.html =404;
        }
    }
}
